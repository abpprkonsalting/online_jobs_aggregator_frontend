name: Deploy Frontend

on:
  push:
    tags: ['v*']

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore annotated release tag after checkout
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --force --no-tags origin "$GITHUB_REF:$GITHUB_REF"
          test "$(git cat-file -t "$GITHUB_REF")" = tag
          test "$(git rev-parse "$GITHUB_REF^{}")" = "$GITHUB_SHA"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run lint
        run: npm run lint

      - name: Run frontend tests
        run: npm test -- --watch=false

      - name: Build production bundle
        run: npm run build

      - name: Generate deployment version metadata
        env:
          DEPLOYMENT_ENVIRONMENT: production
        run: npm run version:metadata

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_SSH_PORT: ${{ secrets.VPS_SSH_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_SSH_KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          eval "$(ssh-agent -s)"
          printf '%s\n' "$SSH_KEY" | tr -d '\r' | ssh-add -
          rsync -avz -e "ssh -p $VPS_SSH_PORT -o StrictHostKeyChecking=yes" \
            dist/online-jobs-aggregator/browser/ "$VPS_USER@$VPS_HOST:/var/www/map_rezi/frontend/"
          ssh -p "$VPS_SSH_PORT" -o StrictHostKeyChecking=yes "$VPS_USER@$VPS_HOST" \
            "sudo systemctl reload apache2"
